name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest

  minimum-versions:
    # The oldest dependency versions pyproject.toml allows, so the floors stay true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: >-
          python -m pip install "numpy==1.24.*" "pandas==2.0.*" "scikit-learn==1.4.*"
          "scipy==1.10.*" "pyyaml==6.0.*" "threadpoolctl==3.1.*" pytest
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest
